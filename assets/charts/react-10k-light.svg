<title id="title">react-10k benchmark results</title>
<desc id="description">Startup · no cache (ms); Startup · with cache (ms); HMR (ms); Build · no cache (ms); Build · with cache (ms); Output size (kB); Build peak memory · no cache (MiB); Build peak memory · with cache (MiB); Gzipped size (kB); Dev steady memory · no cache (MiB); Dev steady memory · with cache (MiB); Dev peak memory · no cache (MiB); Dev peak memory · with cache (MiB). Each chart shows one metric on its own linear scale from zero to its maximum. Lower is better. Colors indicate rank within each chart, progressing from teal through blue to violet as rank increases. Equal displayed values share a rank. Bar lengths are comparable within a chart; compare numeric values across charts. Tool order is consistent across charts. Versions and the same measurements are available in the README tables.</desc>
